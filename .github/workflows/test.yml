name: test

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon test
      - run: moon test --target js
      - run: moon test --target wasm-gc
      - run: moon build --target native cmd/main
      - run: moon build --target js webcore --release
      - run: moon run cmd/main --target native -- check schemas/png.mbs
      - run: moon run cmd/main --target native -- validate fixtures/sample.png -s schemas/png.mbs
      - run: moon run cmd/main --target native -- validate fixtures/corrupt.png -s schemas/png.mbs